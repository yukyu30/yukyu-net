<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Agent接続構成図</title>
  <desc id="desc">Discordからロリポップ！AIエージェントクラウド上のHermes Agentへ接続し、MCP、GitHub、デプロイナウ、AIモデルを利用する構成。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{font-family:"JetBrains Mono","Noto Sans JP",monospace}
      .title{fill:#f8fafc;font-size:28px;font-weight:700}
      .subtitle{fill:#94a3b8;font-size:14px}
      .name{fill:#f8fafc;font-size:17px;font-weight:700}
      .detail{fill:#94a3b8;font-size:12px}
      .group{fill:#cbd5e1;font-size:13px;font-weight:700;letter-spacing:1px}
      .line{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}
      .node{fill:#0f172a;stroke-width:2}
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="#020617"/>
  <rect width="1200" height="760" rx="24" fill="url(#grid)"/>

  <circle cx="48" cy="47" r="7" fill="#22d3ee" filter="url(#glow)"/>
  <text x="68" y="55" class="title">Hermes Agent — Connected Architecture</text>
  <text x="68" y="80" class="subtitle">ロリポップ！AIエージェントクラウドで常時稼働するコンシェルジュの接続構成</text>

  <!-- Arrows are drawn behind components -->
  <path class="line" d="M600 170V214"/>
  <path class="line" d="M600 354V400H230V452"/>
  <path class="line" d="M600 354V400H600V452"/>
  <path class="line" d="M600 354V400H970V452"/>
  <path class="line" d="M230 520V558H130V590"/>
  <path class="line" d="M230 520V558H330V590"/>
  <path class="line" d="M130 664V680"/>
  <path class="line" d="M330 664V680"/>
  <path class="line" d="M600 520V558H515V590"/>
  <path class="line" d="M600 520V558H705V590"/>
  <path class="line" d="M970 520V558H900V590"/>
  <path class="line" d="M970 520V558H1085V590"/>

  <!-- Conversation interface -->
  <rect x="490" y="108" width="220" height="62" rx="10" fill="#0f172a" stroke="#5865f2" stroke-width="2"/>
  <text x="600" y="135" class="name" text-anchor="middle">Discord</text>
  <text x="600" y="155" class="detail" text-anchor="middle">依頼・結果・定期通知</text>

  <!-- Cloud boundary -->
  <rect x="340" y="214" width="520" height="140" rx="18" fill="rgba(120,53,15,.13)" stroke="#fbbf24" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="365" y="242" fill="#fbbf24" font-size="13" font-weight="700">LOLIPOP! AI AGENT CLOUD</text>
  <rect x="440" y="258" width="320" height="72" rx="10" class="node" stroke="#34d399"/>
  <text x="600" y="287" class="name" text-anchor="middle">Hermes Agent</text>
  <text x="600" y="310" class="detail" text-anchor="middle">Gateway · Memory · Skills · Browser · Cron</text>

  <!-- Group gateways -->
  <text x="145" y="438" class="group" text-anchor="middle">MCP SERVERS</text>
  <rect x="125" y="452" width="210" height="68" rx="10" class="node" stroke="#a78bfa"/>
  <text x="230" y="480" class="name" style="font-size:15px" text-anchor="middle">Model Context Protocol</text>
  <text x="230" y="502" class="detail" text-anchor="middle">外部データ・機能</text>

  <text x="505" y="438" class="group" text-anchor="middle">DEVELOP &amp; PUBLISH</text>
  <rect x="495" y="452" width="210" height="68" rx="10" class="node" stroke="#22d3ee"/>
  <text x="600" y="480" class="name" text-anchor="middle">開発・公開</text>
  <text x="600" y="502" class="detail" text-anchor="middle">SSH / CLI</text>

  <text x="875" y="438" class="group" text-anchor="middle">MODEL PROVIDERS</text>
  <rect x="865" y="452" width="210" height="68" rx="10" class="node" stroke="#fb923c"/>
  <text x="970" y="480" class="name" text-anchor="middle">AIモデル</text>
  <text x="970" y="502" class="detail" text-anchor="middle">推論・検索</text>

  <!-- MCP nodes -->
  <rect x="40" y="590" width="180" height="74" rx="10" class="node" stroke="#a78bfa"/>
  <text x="130" y="620" class="name" text-anchor="middle">Woodstock</text>
  <text x="130" y="644" class="detail" text-anchor="middle">米国株・口座・分析</text>

  <rect x="240" y="590" width="180" height="74" rx="10" class="node" stroke="#a78bfa"/>
  <text x="330" y="620" class="name" text-anchor="middle">mymind</text>
  <text x="330" y="644" class="detail" text-anchor="middle">保存・検索・整理</text>

  <rect x="40" y="680" width="180" height="48" rx="10" class="node" stroke="#a78bfa"/>
  <text x="130" y="710" class="detail" text-anchor="middle">Filesystem MCP</text>
  <rect x="240" y="680" width="180" height="48" rx="10" class="node" stroke="#a78bfa"/>
  <text x="330" y="710" class="detail" text-anchor="middle">Time MCP</text>

  <!-- Development nodes -->
  <rect x="430" y="590" width="170" height="74" rx="10" class="node" stroke="#22d3ee"/>
  <text x="515" y="620" class="name" text-anchor="middle">GitHub</text>
  <text x="515" y="644" class="detail" text-anchor="middle">repo · commit · push</text>

  <rect x="620" y="590" width="170" height="74" rx="10" class="node" stroke="#22d3ee"/>
  <text x="705" y="620" class="name" text-anchor="middle">デプロイナウ</text>
  <text x="705" y="644" class="detail" text-anchor="middle">CLIでサイト公開</text>

  <!-- Model nodes -->
  <rect x="810" y="590" width="180" height="74" rx="10" class="node" stroke="#fb923c"/>
  <text x="900" y="620" class="name" text-anchor="middle">OpenAI Codex</text>
  <text x="900" y="644" class="detail" text-anchor="middle">主なLLM</text>

  <rect x="1010" y="590" width="150" height="74" rx="10" class="node" stroke="#fb923c"/>
  <text x="1085" y="620" class="name" text-anchor="middle">xAI / Grok</text>
  <text x="1085" y="644" class="detail" text-anchor="middle">検索・補助処理</text>
</svg>
