<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
  <title id="title">生活と開発の2つのチーム</title>
  <desc id="desc">私が相談する先は、生活の頂点にいるジュイスと、開発の頂点にいるロクサン。ジュイスの下にはFP。ロクサンの下にはプロダクトマネージャー、コーダー、ブランドマネージャー、経理、サポートが同列に並ぶ。メーラーと購買部は両方を横断する。</desc>
  <defs>
    <clipPath id="development-pyramid">
      <path d="M700 110L410 430H990Z"/>
    </clipPath>
  </defs>
  <rect width="1000" height="510" rx="16" fill="#fafaf7"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#0a0a0a">
    <path d="M500 65V85H190V110M500 85H700V110" fill="none" stroke="#888" stroke-width="2"/>
    <rect x="454" y="21" width="92" height="44" rx="8" fill="#fff" stroke="#888"/>
    <text x="500" y="50" font-size="22" font-weight="700">私</text>
    <path d="M190 110L20 430H360Z" fill="#eef2ff" stroke="#002ced" stroke-width="2"/>
    <path d="M700 110L410 430H990Z" fill="#fff1e9" stroke="#d94b18" stroke-width="2"/>
    <path d="M118.28125 245H261.71875" stroke="#002ced" stroke-width="2"/>
    <g clip-path="url(#development-pyramid)" stroke="#d94b18" stroke-width="2">
      <path d="M410 245H990M565 245V430M655 245V430M745 245V430M835 245V430" fill="none"/>
    </g>
    <text x="65" y="150" font-size="22" font-weight="700" fill="#002ced">生活</text>
    <text x="925" y="150" font-size="22" font-weight="700" fill="#b63d12">開発</text>
    <text x="190" y="211" font-size="24" font-weight="700">ジュイス</text>
    <text x="190" y="235" font-size="18">生活中継</text>
    <text x="700" y="205" font-size="24" font-weight="700">ロクサン</text>
    <text x="700" y="232" font-size="18">参謀・段取り・判断</text>
    <text x="190" y="357" font-size="22">FP</text>
    <text x="190" y="385" font-size="18">家計管理・予算管理</text>
    <g font-size="16">
      <text x="518" y="365" font-size="14"><tspan x="518">プロダクト</tspan><tspan x="518" dy="23">マネージャー</tspan></text>
      <text x="610" y="377">コーダー</text>
      <text x="700" y="365" font-size="14"><tspan x="700">ブランド</tspan><tspan x="700" dy="23">マネージャー</tspan></text>
      <text x="790" y="377">経理</text>
      <text x="882" y="377">サポート</text>
    </g>
    <rect x="20" y="415" width="970" height="58" rx="8" fill="#fff" stroke="#444" stroke-width="2"/>
    <text x="500" y="451" font-size="22" font-weight="700">メーラー・購買部</text>
    <text x="500" y="497" font-size="18" fill="#555">生活と開発の両方を横断する共通の担当</text>
  </g>
</svg>
